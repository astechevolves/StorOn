#####################################################################
#                  StorOn lane integration
#####################################################################
# StorOn's ESP32 reads _STORON through Moonraker (about once a second)
# to tie the spool held in each StorOn lane to the tool that lane feeds:
#
#   loaded   -> the spool in that tool's lane is the tool's spool
#   unloaded -> the lane releases its spool
#
# StorOn only acts on changes, so a Klipper restart (which resets these
# variables) never releases a lane by itself. With [save_variables] in
# your config, each tool's state also survives the restart.
#
# Install: copy next to your other macro files, include it from
# printer.cfg, and call STORON_TOOL_EVENT at the end of your own load and
# unload macros. See README.md in this folder.
#####################################################################

[gcode_macro _STORON]
description: StorOn lane state, read by the StorOn ESP32 through Moonraker
# Per tool (index = tool number): -1 unknown, 0 unloaded, 1 loaded
variable_tool_loaded: [-1, -1, -1, -1, -1, -1]
# Increments on every load/unload event
variable_seq: 0
variable_last_event: ""
variable_last_tool: -1
# Optional: name of each tool's filament_switch_sensor, used only to seed
# the state at startup. {n} is replaced by the tool number. Single-extruder
# printers: put your sensor's name here (e.g. "filament_sensor"). Leave
# empty if you have no sensor; tools then start as unknown.
variable_sensor_pattern: "T{n}_filament_sensor"
gcode:
    {% set s = printer["gcode_macro _STORON"] %}
    RESPOND MSG="StorOn: tool_loaded={s.tool_loaded} seq={s.seq} last={s.last_event} T{s.last_tool}"

#####################################################################
#   STORON_TOOL_EVENT EVENT=loaded|unloaded [TOOL=n | EXTRUDER=name]
#
#   TOOL=n          the tool number
#   EXTRUDER=name   toolchangers: find the tool that owns this extruder
#   (neither)       the active tool on a toolchanger, else tool 0
#####################################################################
[gcode_macro STORON_TOOL_EVENT]
description: Tell StorOn a tool finished loading or unloading
gcode:
    {% set s = printer["gcode_macro _STORON"] %}
    {% set event = params.EVENT|default("")|lower %}
    {% if event not in ["loaded", "unloaded"] %}
        {action_raise_error("STORON_TOOL_EVENT: EVENT must be loaded or unloaded")}
    {% endif %}

    {% set ns = namespace(tool=-1) %}
    {% if params.TOOL is defined %}
        {% set ns.tool = params.TOOL|int %}
    {% elif params.EXTRUDER is defined %}
        {% if printer.toolchanger is defined %}
            {% for n in printer.toolchanger.tool_numbers %}
                {% if printer["tool T" ~ n].extruder == params.EXTRUDER|string %}
                    {% set ns.tool = n %}
                {% endif %}
            {% endfor %}
        {% else %}
            # Plain multi-extruder: extruder -> 0, extruder1 -> 1, ...
            {% set ex = params.EXTRUDER|string %}
            {% set ns.tool = 0 if ex == "extruder" else ex|replace("extruder", "")|int(-1) %}
        {% endif %}
    {% elif printer.toolchanger is defined %}
        {% set ns.tool = printer.toolchanger.tool_number|int %}
    {% else %}
        {% set ns.tool = 0 %}
    {% endif %}

    {% set states = s.tool_loaded|list %}
    {% if ns.tool < 0 or ns.tool >= states|length %}
        RESPOND TYPE=error MSG="StorOn: no tool for {params.TOOL|default(params.EXTRUDER|default('active tool'))}, event ignored"
    {% else %}
        {% set new_states = states[:ns.tool] + [1 if event == "loaded" else 0] + states[ns.tool + 1:] %}
        SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=tool_loaded VALUE="{new_states}"
        {% if printer.save_variables is defined %}
            # survives a Klipper restart (see _STORON_INIT)
            SAVE_VARIABLE VARIABLE=storon_tool_loaded VALUE="{new_states}"
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=seq VALUE={s.seq + 1}
        SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=last_event VALUE="'{event}'"
        SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=last_tool VALUE={ns.tool}
        RESPOND MSG="StorOn: T{ns.tool} {event}"
    {% endif %}

#####################################################################
#   STORON_CHECK_LOADED [TOOLS=0,2,4]
#
#   Call it from PRINT_START, before heating or purging. It stops the
#   print with an error if a tool the print uses isn't loaded, as
#   recorded by STORON_TOOL_EVENT. A tool that was unloaded still has
#   the old spool's filament at its sensor, so this catches what a
#   filament sensor can't. TOOLS takes the slicer's list in any common
#   form ("0,2,4", "[0, 2]", "T0 T2"); without it, the active tool (or
#   tool 0) is checked.
#####################################################################
[gcode_macro STORON_CHECK_LOADED]
description: Stop if a tool the print uses isn't loaded
gcode:
    {% set states = printer["gcode_macro _STORON"].tool_loaded|list %}
    {% set raw = params.TOOLS|default("")|string %}
    {% if raw|trim|length == 0 %}
        {% set active = printer.toolchanger.tool_number|int if printer.toolchanger is defined else 0 %}
        {% set raw = [active, 0]|max|string %}
    {% endif %}
    {% set clean = raw|upper|replace("T", " ")|replace(",", " ")|replace("[", " ")|replace("]", " ")|replace('"', " ")|replace("'", " ") %}
    {% set ns = namespace(bad=[]) %}
    {% for tok in clean.split() %}
        {% set t = tok|int(-1) %}
        {% if t < 0 or t >= states|length or states[t] != 1 %}
            {% set ns.bad = ns.bad + ["T" ~ tok] %}
        {% endif %}
    {% endfor %}
    {% if ns.bad %}
        {action_raise_error("StorOn: " ~ ns.bad|join(", ") ~ " not loaded. Load it first; if it is loaded, run STORON_TOOL_EVENT EVENT=loaded TOOL=<n> or use Mark loaded in StorOn.")}
    {% endif %}
    RESPOND MSG="StorOn: T{clean.split()|join(', T')} loaded"

#####################################################################
# At startup, restore each tool's state: from [save_variables] when the
# printer has it (STORON_TOOL_EVENT saves every change there), else from
# the tool's filament sensor. A sensor can't tell an unloaded tool from a
# loaded one while the old filament still sits at it, so the saved state
# wins; the sensor only fills tools with nothing saved. This is state,
# not an event: seq doesn't change, and StorOn ignores the jump from -1.
#####################################################################
[delayed_gcode _STORON_INIT]
initial_duration: 3.0
gcode:
    {% set s = printer["gcode_macro _STORON"] %}
    {% set pattern = s.sensor_pattern|default("")|string %}
    {% set tools = printer.toolchanger.tool_numbers if printer.toolchanger is defined else [0] %}
    {% set saved = printer.save_variables.variables.storon_tool_loaded|default(none) if printer.save_variables is defined else none %}
    {% set ns = namespace(states=s.tool_loaded|list) %}
    {% if saved is not none %}
        {% for v in saved|list %}
            {% if loop.index0 < ns.states|length %}
                {% set ns.states = ns.states[:loop.index0] + [v|int] + ns.states[loop.index0 + 1:] %}
            {% endif %}
        {% endfor %}
    {% endif %}
    {% if pattern %}
        {% for n in tools %}
            {% set sensor = "filament_switch_sensor " ~ pattern|replace("{n}", n|string) %}
            {% if n < ns.states|length and ns.states[n] == -1 and sensor in printer %}
                {% set val = 1 if printer[sensor].filament_detected else 0 %}
                {% set ns.states = ns.states[:n] + [val] + ns.states[n + 1:] %}
            {% endif %}
        {% endfor %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=tool_loaded VALUE="{ns.states}"
    SET_GCODE_VARIABLE MACRO=_STORON VARIABLE=last_event VALUE="'init'"
